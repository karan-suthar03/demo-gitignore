# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name demo.being-karan.in;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.being-karan.in;

    # TLS — provisioned by: sudo certbot --nginx -d demo.being-karan.in
    ssl_certificate     /etc/letsencrypt/live/demo.being-karan.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.being-karan.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Frontend (Vite build) ────────────────────────────────────────────────
    root  /var/www/example-app/frontend/dist;
    index index.html;

    # SPA fallback — always serve index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API (Express on port 3001) ───────────────────────────────────
    location ~* ^/(signup|enroll-device|login|logout|auth|new-device|protected|backdoor) {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Ensure cookies are forwarded correctly
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }
}
