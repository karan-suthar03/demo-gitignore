name: Deploy to demo.being-karan.in

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for context / SHA logging)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host:        ${{ secrets.SSH_HOST }}
          username:    ${{ secrets.SSH_USER }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          port:        ${{ secrets.SSH_PORT || 22 }}
          envs:        DEPLOY_PATH
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_PATH"

            echo "── Pulling latest code ──────────────────────────"
            git pull origin main

            echo "── Installing backend dependencies ──────────────"
            cd backend
            npm ci --omit=dev
            cd ..

            echo "── Building frontend ────────────────────────────"
            cd frontend
            npm ci
            npm run build
            cd ..

            echo "── Updating Nginx config ────────────────────────"
            sudo cp nginx/demo.being-karan.in.conf /etc/nginx/sites-available/demo.being-karan.in
            sudo ln -sf /etc/nginx/sites-available/demo.being-karan.in \
                        /etc/nginx/sites-enabled/demo.being-karan.in
            sudo nginx -t
            sudo systemctl reload nginx

            echo "── Restarting backend with PM2 ──────────────────"
            pm2 describe example-app-backend > /dev/null 2>&1 \
              && pm2 restart example-app-backend \
              || pm2 start ecosystem.config.cjs
            pm2 save
            echo "── Done ✓ ───────────────────────────────────────"
