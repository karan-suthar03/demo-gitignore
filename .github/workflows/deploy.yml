name: Deploy to demo.being-karan.in

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: /var/www/example-app

jobs:
  deploy:
    name: Deploy Backend & Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build frontend in CI ──────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Deploy via SSH ────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload backend to server
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$APP_DIR/backend/

      - name: Upload frontend build to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$APP_DIR/frontend/dist/

      - name: Upload deployment configs to server
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ecosystem.config.cjs \
            nginx/demo.being-karan.in.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$APP_DIR/

      - name: Install dependencies & restart services
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOY_SCRIPT'

            set -e
            APP_DIR=/var/www/example-app

            echo "── Installing backend dependencies ──"
            cd $APP_DIR/backend
            npm ci --omit=dev

            echo "── Restarting backend with PM2 ──"
            cd $APP_DIR
            pm2 describe example-app-backend > /dev/null 2>&1 \
              && pm2 restart example-app-backend \
              || pm2 start ecosystem.config.cjs
            pm2 save

            echo "── Reloading Nginx ──"
            CERT_FILE="/etc/letsencrypt/live/demo.being-karan.in/fullchain.pem"

            if [ ! -f "$CERT_FILE" ]; then
              echo "SSL certs not found — provisioning with Certbot..."

              # Temporary HTTP-only config for ACME challenge
              sudo tee /etc/nginx/sites-available/demo.being-karan.in > /dev/null <<'NGINX_HTTP'
              server {
                listen 80;
                listen [::]:80;
                server_name demo.being-karan.in;
                location /.well-known/acme-challenge/ { root /var/www/certbot; }
                location / { return 200 'Provisioning SSL...'; add_header Content-Type text/plain; }
              }
              NGINX_HTTP
              sudo ln -sf /etc/nginx/sites-available/demo.being-karan.in \
                          /etc/nginx/sites-enabled/demo.being-karan.in
              sudo mkdir -p /var/www/certbot
              sudo nginx -t && sudo systemctl reload nginx

              sudo certbot certonly --webroot -w /var/www/certbot \
                -d demo.being-karan.in --non-interactive --agree-tos \
                -m ${{ secrets.CERTBOT_EMAIL }}

              # Download SSL helpers if missing (not created by --webroot mode)
              [ -f /etc/letsencrypt/options-ssl-nginx.conf ] || \
                sudo curl -sSL https://raw.githubusercontent.com/certbot/certbot/main/certbot-nginx/certbot_nginx/_internal/tls_configs/options-ssl-nginx.conf \
                  -o /etc/letsencrypt/options-ssl-nginx.conf
              [ -f /etc/letsencrypt/ssl-dhparams.pem ] || \
                sudo curl -sSL https://raw.githubusercontent.com/certbot/certbot/main/certbot/certbot/ssl-dhparams.pem \
                  -o /etc/letsencrypt/ssl-dhparams.pem
            fi

            # Apply full SSL config
            sudo cp $APP_DIR/demo.being-karan.in.conf /etc/nginx/sites-available/demo.being-karan.in
            sudo ln -sf /etc/nginx/sites-available/demo.being-karan.in \
                        /etc/nginx/sites-enabled/demo.being-karan.in
            sudo nginx -t && sudo systemctl reload nginx

            echo "✓ Deployment complete!"
          DEPLOY_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
